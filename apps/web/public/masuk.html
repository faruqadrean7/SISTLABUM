<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Masuk Portal Akademik | SMP Laboratorium UM</title>
    <meta name="description" content="Pintu Masuk SSO Portal Akademik SMP Laboratorium P2LP Universitas Negeri Malang."/>
    <link rel="shortcut icon" href="/images/logo.png"/>
    <link rel="icon" href="/images/logo.png"/>
    <link rel="apple-touch-icon" href="/images/logo.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/demo-tailwind.css"/>
    <link rel="stylesheet" href="/css/main.css"/>
    <link rel="stylesheet" href="/css/portal.css"/>
</head>
<body class="min-h-screen flex flex-col antialiased bg-navy-deep text-[#1B2430] selection:bg-[#F4E2BD] selection:text-[#062940]">

    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-navy-deep via-navy to-navy-deep p-4">
        <div class="w-full max-w-md">
            <!-- Brand Header -->
            <div class="text-center mb-6">
                <a class="inline-flex items-center gap-3 mb-2" href="/">
                    <img alt="Logo SMP Laboratorium" width="52" height="52" class="w-12 h-12 object-contain flex-shrink-0 drop-shadow-md" src="/images/logo.png"/>
                    <div class="text-left">
                        <span class="font-heading font-bold text-lg text-white block leading-tight">SMP Laboratorium</span>
                        <span class="text-xs text-gold-soft block font-medium">Portal Akademik Terpadu</span>
                    </div>
                </a>
                <p class="text-xs text-white/70">Sistem Informasi Manajemen Nilai, Presensi &amp; Akademik</p>
            </div>

            <!-- Login Card -->
            <div class="bg-surface border border-line rounded-[10px] p-6 sm:p-8 shadow-2xl">
                <!-- Role Selector Tabs -->
                <div class="flex bg-[#F6F7F9] p-1 rounded-[6px] mb-6">
                    <button type="button" id="tab-siswa" onclick="setRole('siswa')" class="flex-1 py-2 text-xs font-bold rounded-[6px] transition-all capitalize bg-navy text-white shadow-sm">
                        Siswa
                    </button>
                    <button type="button" id="tab-guru" onclick="setRole('guru')" class="flex-1 py-2 text-xs font-bold rounded-[6px] transition-all capitalize text-ink-soft hover:text-navy">
                        Guru
                    </button>
                    <button type="button" id="tab-ortu" onclick="setRole('ortu')" class="flex-1 py-2 text-xs font-bold rounded-[6px] transition-all capitalize text-ink-soft hover:text-navy">
                        Orang Tua
                    </button>
                </div>

                <!-- Simulation Notice -->
                <div class="bg-gold-subtle border border-[#E8D2A2] rounded-[6px] p-2.5 text-xs text-[#784E07] mb-5 leading-relaxed">
                    <strong>Mode Simulasi Front-End:</strong> Gunakan akun demo atau klik langsung tombol <em>Masuk</em> untuk melihat antarmuka dashboard.
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label id="input-label" class="block text-xs font-semibold text-navy mb-1.5">NISN / Nomor Induk Siswa</label>
                        <input type="text" id="username" placeholder="Contoh: 0089123456" required class="w-full px-3.5 py-2.5 text-sm rounded-[10px] border border-line focus:outline-none focus:ring-2 focus:ring-navy/20" value="0089123456"/>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-xs font-semibold text-navy">Kata Sandi</label>
                            <button type="button" onclick="alert('Untuk keperluan prototipe, silakan gunakan kata sandi: password123')" class="text-[0.7rem] text-navy hover:text-gold">Lupa Sandi?</button>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" required class="w-full px-3.5 py-2.5 text-sm rounded-[10px] border border-line focus:outline-none focus:ring-2 focus:ring-navy/20" value="password123"/>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-navy hover:bg-navy-light text-white font-bold text-sm py-3 rounded-[10px] shadow transition-all disabled:opacity-50 mt-4">
                        Masuk ke Dashboard Siswa →
                    </button>
                </form>

                <div class="text-center pt-4 border-t border-line-light mt-6 text-xs text-ink-muted">
                    Belum memiliki akun? <a class="text-navy font-semibold hover:text-gold" href="/kontak">Hubungi Admin IT Sekolah</a>
                </div>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-6">
                <a class="inline-flex items-center gap-1.5 text-xs text-white/80 hover:text-white transition-colors" href="/">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                    Kembali ke Website Utama SMP Laboratorium
                </a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentRole = 'siswa';

        function setRole(role) {
            currentRole = role;
            const tabs = ['siswa', 'guru', 'ortu'];
            tabs.forEach(t => {
                const btn = document.getElementById('tab-' + t);
                if (t === role) {
                    btn.className = 'flex-1 py-2 text-xs font-bold rounded-[6px] transition-all capitalize bg-navy text-white shadow-sm';
                } else {
                    btn.className = 'flex-1 py-2 text-xs font-bold rounded-[6px] transition-all capitalize text-ink-soft hover:text-navy';
                }
            });

            const labelEl = document.getElementById('input-label');
            const inputEl = document.getElementById('username');
            const submitBtn = document.getElementById('submit-btn');

            if (role === 'siswa') {
                labelEl.textContent = 'NISN / Nomor Induk Siswa';
                inputEl.placeholder = 'Contoh: 0089123456';
                inputEl.value = '0089123456';
                submitBtn.textContent = 'Masuk ke Dashboard Siswa →';
            } else if (role === 'guru') {
                labelEl.textContent = 'NIP / NUPTK Guru';
                inputEl.placeholder = 'Contoh: 198205142008011002';
                inputEl.value = '198205142008011002';
                submitBtn.textContent = 'Masuk ke Dashboard Guru →';
            } else if (role === 'ortu') {
                labelEl.textContent = 'Nomor WhatsApp / HP Orang Tua';
                inputEl.placeholder = 'Contoh: 081234567890';
                inputEl.value = '081234567890';
                submitBtn.textContent = 'Masuk ke Dashboard Orang Tua →';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            App.toast('Otentikasi berhasil. Mengarahkan ke dashboard ' + currentRole.toUpperCase() + '...', 'success');

            setTimeout(() => {
                if (currentRole === 'siswa') {
                    window.location.href = '/siswa/index.html';
                } else if (currentRole === 'ortu') {
                    window.location.href = '/ortu/index.html';
                } else if (currentRole === 'guru') {
                    window.location.href = '/admin/nilai.html';
                } else {
                    window.location.href = '/admin/index.html';
                }
            }, 600);
        }
    </script>
</body>
</html>
